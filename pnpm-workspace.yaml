# Match pnpm 11's default so locally resolved lockfiles pass the host's policy check.
minimumReleaseAge: 1440

allowBuilds:
  sharp: false
  unrs-resolver: false

# Patched transitive versions for Dependabot alerts (dev tooling only).
overrides:
  basic-ftp@<6.2.1: 6.2.1
  body-parser@<1.20.9: 1.20.9
  ip-address@<10.7.4: 10.7.4
  minimatch@>=7.0.0 <11.0.1: 11.0.1
  qs@>=6.7.0 <6.16.1: 6.16.1
